name: Publish account deletion page

on:
  push:
    branches: [main]
    paths:
      - "play-store-site/**"
      - ".github/workflows/account-deletion-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: play-store-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
