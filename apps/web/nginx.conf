server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_comp_level 6;
	gzip_min_length 1024;
	gzip_types text/css text/plain application/javascript application/json image/svg+xml;

	# First-party PostHog proxy. Replay scripts are served from the assets host;
	# event ingestion and configuration use the regional ingestion host.
	location /ingest/static/ {
		proxy_ssl_server_name on;
		proxy_set_header Host eu-assets.i.posthog.com;
		proxy_pass https://eu-assets.i.posthog.com/static/;
	}

	location /ingest/array/ {
		proxy_ssl_server_name on;
		proxy_set_header Host eu-assets.i.posthog.com;
		proxy_pass https://eu-assets.i.posthog.com/array/;
	}

	location /ingest/ {
		proxy_ssl_server_name on;
		proxy_set_header Host eu.i.posthog.com;
		proxy_pass https://eu.i.posthog.com/;
	}

	# Vite emits content-hashed files under /assets — safe to cache forever.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# TanStack Router handles routing on the client — fall back to index.html.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri/ /index.html;
	}
}
